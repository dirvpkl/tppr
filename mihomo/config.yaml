# Single local endpoint (HTTP/SOCKS) backed by a pool of upstream proxies.
# No TUN. The tester checks selected nodes in parallel and stops early.
# Container ports 7890/7891/9090 must match docker-compose.yml and tester env.
# allow-lan + empty secret are safe ONLY inside compose (host proxy/API ports
# bind 127.0.0.1; port 7891 is reachable only on the private Docker network).
mixed-port: 7890
# Container must listen on all interfaces (compose maps host 127.0.0.1 only,
# so nothing is exposed to LAN despite allow-lan below).
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: ""

listeners:
  - name: speed-test-in
    type: mixed
    listen: 0.0.0.0
    port: 7891
    proxy: TEST_POOL

profile:
  store-selected: true

dns:
  enable: true
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

proxy-providers:
  free-vless:
    type: http
    url: "https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/clash.yaml"
    path: ./providers/free.yaml
    interval: 21600
    # No background checks: the tester probes selected candidates in batches.
  # Private upstreams: copy providers/mine.yaml.example to providers/mine.yaml,
  # then uncomment the block below. (An empty file provider is rejected, so it
  # stays out of the default config.)
  # mine:
  #   type: file
  #   path: ./providers/mine.yaml

proxy-groups:
  - name: POOL
    type: select
    use: [free-vless]
    empty-fallback: REJECT
  - name: TEST_POOL
    type: select
    use: [free-vless]
    empty-fallback: REJECT
  - name: PROXY
    type: select
    proxies: [POOL, DIRECT]

rules:
  - GEOSITE,telegram,POOL
  - GEOIP,telegram,POOL
  - IP-CIDR,91.108.4.0/22,POOL
  - IP-CIDR,91.108.8.0/22,POOL
  - IP-CIDR,149.154.160.0/20,POOL
  - GEOSITE,youtube,POOL
  - DOMAIN-SUFFIX,googlevideo.com,POOL
  - DOMAIN-SUFFIX,youtube.com,POOL
  - DOMAIN-SUFFIX,youtu.be,POOL
  - MATCH,DIRECT
