name: checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Every service image is pinned to python:3.12-slim, so the checks run on
    # the interpreter the code actually ships on.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # AGENTS.md drives every check through uvx; keeping the same runner means
      # CI executes the documented commands instead of a parallel tool set.
      - uses: astral-sh/setup-uv@v5

      - name: black --check
        run: uvx black --check hash-gate common api scripts pool-worker speed-tester

      - name: ruff format --check
        run: uvx ruff format --check hash-gate common api scripts pool-worker speed-tester

      - name: ruff check
        run: uvx ruff check hash-gate common api scripts pool-worker speed-tester

      - name: isort --check-only
        run: uvx isort --check-only hash-gate common api scripts pool-worker speed-tester

      - name: mypy
        run: uvx mypy hash-gate common api scripts pool-worker speed-tester

      - name: unit tests
        run: |
          python -m pip install --quiet PyYAML==6.0.2
          for suite in hash-gate common api scripts pool-worker speed-tester; do
            echo "::group::$suite"
            python -m unittest discover -s "$suite/tests"
            echo "::endgroup::"
          done
