[target]
group = "SVC_managed"
provider = "my-vless"
username = "managed"

[probe]
url = "https://example.com/api/endpoint"
method = "POST"
timeout_s = 15
expected_status = 400
interval_s = 15
body_file = "/config/post-prober-body.json"

[probe.headers]
Content-Type = "application/json"
x-opencode-session = "paste-live-session-here"
User-Agent = "opencode/1.18.32 ai-sdk/provider-utils/4.0.40 runtime/node.js/24"

[filter]
# Denylist of ISO country codes, read from the flag prefix in a provider node
# name (🇷🇺 -> RU). Nodes without a flag are never denied. This filter is
# static; only the node-verdict cache resets at 00:00 UTC.
exclude_countries = ["RU", "CN"]
