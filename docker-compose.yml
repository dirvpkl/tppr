name: tppr

# Shared json-file rotation: bounds daemon disk use. It does NOT survive
# `recreate` (new container id); recreate-proof history lives in ./logs/
# file logs (see per-service volumes below).
x-logging: &tppr-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The relay exposes the global endpoint and controller on Windows localhost.
# Additional fixed service ports are generated into docker-compose.override.yml.
# The optional pool-aggregation profile adds internal SubConv and pool-worker services.

services:
  tppr-mihomo-relay:
    image: metacubex/mihomo:${MIHOMO_TAG:?mihomo image tag is required, e.g. MIHOMO_TAG=latest}
    container_name: tppr-mihomo-relay
    restart: unless-stopped
    logging: *tppr-logging
    volumes:
      - ./mihomo:/etc/mihomo
      - ./logs:/var/log/tppr
    ports:
      # The mixed endpoint is intentionally unpublished: pool access goes
      # through authenticated dispatcher accounts, fixed service ports and
      # the hash gate. The controller stays on localhost.
      - "127.0.0.1:${HOST_CONTROLLER_PORT:?host controller port is required, e.g. HOST_CONTROLLER_PORT=9090}:9090"
    # tee keeps stdout (docker logs) AND appends a recreate-proof copy to the
    # mounted ./logs volume. No new ports, no secrets in the stream.
    # NOTE: entrypoint (not command): the image ENTRYPOINT is /mihomo, a
    # command list would be appended to it and misparsed.
    entrypoint:
      [
        "sh",
        "-c",
        "/mihomo -d /etc/mihomo -f /etc/mihomo/generated/config.yaml 2>&1 | tee -a /var/log/tppr/mihomo-relay.log",
      ]

  tppr-subconv:
    image: wouisb/subconv:latest
    container_name: tppr-subconv
    restart: unless-stopped
    profiles: ["pool-aggregation"]
    expose:
      - "8080"

  tppr-pool-worker:
    build:
      context: .
      dockerfile: ./pool-worker/Dockerfile
    container_name: tppr-pool-worker
    restart: unless-stopped
    profiles: ["pool-aggregation"]
    depends_on:
      - tppr-subconv
    expose:
      - "8080"
    volumes:
      - ./pool-sources.toml:/config/pool-sources.toml:ro
      - ./mihomo/providers:/providers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  tppr-hash-gate:
    build:
      context: .
      dockerfile: ./hash-gate/Dockerfile
    container_name: tppr-hash-gate
    restart: unless-stopped
    profiles: ["pool-aggregation"]
    depends_on:
      - tppr-pool-worker
    expose:
      - "17894"
      - "17895"
      - "17896"
    ports:
      # Only the all-pools gateway is published. The free/custom gateways keep
      # listening inside the compose network; publish them here to enable.
      - "0.0.0.0:${HASH_GATE_ALL_PORT:-17894}:${HASH_GATE_ALL_PORT:-17894}"
    environment:
      HASH_GATE_ALL_PORT: ${HASH_GATE_ALL_PORT:-17894}
      HASH_GATE_FREE_PORT: ${HASH_GATE_FREE_PORT:-17895}
      HASH_GATE_CUSTOM_PORT: ${HASH_GATE_CUSTOM_PORT:-17896}
    volumes:
      - ./mihomo/providers:/pools:ro
      - ./mihomo/providers/mine.yaml:/custom/mine.yaml:ro
      - hash-gate-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,socket;[socket.create_connection(('127.0.0.1',int(os.environ['HASH_GATE_FREE_PORT'])),timeout=2).close()]",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  tppr-speed-tester:
    build: ./speed-tester
    container_name: tppr-speed-tester
    restart: unless-stopped
    logging: *tppr-logging
    depends_on:
      - tppr-mihomo-relay
    environment:
      MIHOMO_API: http://tppr-mihomo-relay:9090
      PROXY_URL: http://tppr-mihomo-relay:7891
      TEST_GROUP: ${TEST_GROUP:?proxy group used only for speed probes is required, e.g. TEST_GROUP=TEST_POOL}
      PRODUCTION_GROUP: ${PRODUCTION_GROUP:?production proxy group is required, e.g. PRODUCTION_GROUP=POOL}
      PROVIDER_NAMES: ${PROVIDER_NAMES:?comma-separated provider names is required, e.g. PROVIDER_NAMES=free-vless}
      HEALTH_URL: ${HEALTH_URL:?HTTP health-check URL is required}
      HEALTH_INTERVAL_S: ${HEALTH_INTERVAL_S:?current-node health interval in seconds is required, e.g. HEALTH_INTERVAL_S=10}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:?health probe timeout in milliseconds is required, e.g. HEALTH_TIMEOUT_MS=3000}
      MAX_DELAY_MS: ${MAX_DELAY_MS:?maximum acceptable candidate latency is required, e.g. MAX_DELAY_MS=800}
      PROBE_BATCH_SIZE: ${PROBE_BATCH_SIZE:?nodes probed per batch is required, e.g. PROBE_BATCH_SIZE=100}
      PROBE_WORKERS: ${PROBE_WORKERS:?parallel probe workers is required, e.g. PROBE_WORKERS=100}
      MAX_PROBE_BATCHES: ${MAX_PROBE_BATCHES:?maximum candidate batches per scan is required, e.g. MAX_PROBE_BATCHES=3}
      FAILOVER_GOOD_CANDIDATES: ${FAILOVER_GOOD_CANDIDATES:?good candidates required for failover is required, e.g. FAILOVER_GOOD_CANDIDATES=1}
      SWEEP_GOOD_CANDIDATES: ${SWEEP_GOOD_CANDIDATES:?good candidates required for a sweep is required, e.g. SWEEP_GOOD_CANDIDATES=5}
      TEST_URL: ${TEST_URL:?download URL for speed probes is required}
      TEST_INTERVAL_S: ${TEST_INTERVAL_S:?sweep interval in seconds is required, e.g. TEST_INTERVAL_S=300}
      TEST_TIMEOUT_S: ${TEST_TIMEOUT_S:?per-node probe timeout in seconds is required, e.g. TEST_TIMEOUT_S=15}
      TEST_MAX_BYTES: ${TEST_MAX_BYTES:?download cap per probe in bytes is required, e.g. TEST_MAX_BYTES=8388608}
      TEST_MAX_NODES: ${TEST_MAX_NODES:?throughput probes per sweep is required, e.g. TEST_MAX_NODES=5}
      HISTORY_DB: /app/data/history.db
      HISTORY_COOLDOWN_FAILS: ${HISTORY_COOLDOWN_FAILS:?consecutive failures before cooldown is required, e.g. HISTORY_COOLDOWN_FAILS=3}
      HISTORY_COOLDOWN_H: ${HISTORY_COOLDOWN_H:?cooldown decay window in hours is required, e.g. HISTORY_COOLDOWN_H=1}
      HISTORY_WINDOW_H: ${HISTORY_WINDOW_H:?history window in hours is required, e.g. HISTORY_WINDOW_H=24}
      LOG_FILE: /var/log/tppr/tppr-speed-tester.log
    volumes:
      - tester-data:/app/data
      - ./logs:/var/log/tppr

  tppr-post-prober:
    build: ./post-prober
    container_name: tppr-post-prober
    restart: unless-stopped
    logging: *tppr-logging
    depends_on:
      - tppr-mihomo-relay
    environment:
      MIHOMO_API: http://tppr-mihomo-relay:9090
      PROXY_HOST: tppr-mihomo-relay
      # The dispatcher port and the probed account's password are read from
      # services.toml, the single source for both.
      SERVICES_FILE: /config/services.toml
      PROBER_FILE: /config/post-prober.toml
      HEARTBEAT_MAX_AGE_S: ${POST_PROBER_HEARTBEAT_MAX_AGE_S:-180}
      LOG_FILE: /var/log/tppr/tppr-post-prober.log
    volumes:
      - ./services.toml:/config/services.toml:ro
      - ./post-prober.toml:/config/post-prober.toml:ro
      - ./post-prober-body.json:/config/post-prober-body.json:ro
      - ./logs:/var/log/tppr
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,time;p='/tmp/post-prober-heartbeat';exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < int(os.environ['HEARTBEAT_MAX_AGE_S']) else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tppr-api:
    build: ./api
    container_name: tppr-api
    restart: unless-stopped
    logging: *tppr-logging
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${API_PORT:-18080}:${API_PORT:-18080}"
    environment:
      API_TOKEN: ${API_TOKEN:?management API token is required, generate one with python -c "import secrets;print(secrets.token_urlsafe(32))"}
      PORT: ${API_PORT:-18080}
      WORKER_URL: http://tppr-pool-worker:8080
      LOG_FILE: /var/log/tppr/tppr-api.log
    volumes:
      - ./services.toml:/config/services.toml
      - ./mihomo:/mihomo:ro
      - ./scripts:/scripts:ro
      - hash-gate-data:/hashdata
      - ./logs:/var/log/tppr
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import http.client,os;c=http.client.HTTPConnection('127.0.0.1',int(os.environ.get('PORT','8080')),timeout=2);c.request('GET','/');print(c.getresponse().status)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  tester-data:
  hash-gate-data:
